name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Daily redeploy of main so the crawler snapshots (tools/prerender.mjs) pick up content edited in
  # Firestore since the last push; humans always get live content, bots get the latest snapshot.
  schedule:
    - cron: "17 9 * * *"

# A push and the daily refresh must never deploy over each other.
concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Vercel Hobby deployments may be blocked if the Git commit author is not the Vercel project owner.
      # This amends the checked-out commit locally (without pushing) so the deploy is attributed to the owner.
      - name: Normalize Git author for Vercel
        run: |
          git config user.name "Andrey Vasilyev"
          git config user.email "118031542+Andrey199123@users.noreply.github.com"
          git commit --amend --no-edit --reset-author

      - name: Install Vercel CLI
        run: npm install -g vercel

      # Static snapshots of every public page for AI crawlers that don't run JavaScript (served by
      # middleware.js). Uses the runner's preinstalled Google Chrome; playwright-core goes to a temp
      # dir so it never enters package.json (Vercel's build runs `npm install`). The script falls
      # back to raw page shells instead of failing, so this step only fails on a genuine crash.
      - name: Render crawler snapshots
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --silent playwright-core@1
          PLAYWRIGHT_CORE_DIR="$RUNNER_TEMP/pw" node tools/prerender.mjs

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      # Tell Bing & the other IndexNow engines to recrawl. Pushes only — the daily refresh changes
      # nothing a search engine needs to hear about. A failed ping never fails the deploy.
      - name: Ping IndexNow
        if: github.event_name == 'push'
        continue-on-error: true
        run: node tools/indexnow.mjs
