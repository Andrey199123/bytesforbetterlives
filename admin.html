<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Chapter Admin | Bytes for Better Lives</title>
    <link rel="icon" type="image/avif" href="images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">

    <meta name="google-site-verification" content="zX6BUNOBV4yH4PZD7fEVflyBRPSL3XbNYfznUh8AgJU" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="images/logo.avif" alt="Bytes for Better Lives logo"></a>
            <ul class="nav-menu"></ul>
        </div>
    </nav>

    <main>
        <section class="section" style="padding-block: 1.25rem 3rem;">
            <div class="admin-wrap">
                <div class="admin-head">
                    <div>
                        <h1 style="margin:0; font-size:1.6rem;">Chapter Admin</h1>
                        <p style="color:var(--ink-soft); margin:0.35rem 0 0;">Select your chapter to sign in and edit its page and members.</p>
                    </div>
                </div>

                <div id="admin-chapter-grid" class="admin-chapter-grid" style="margin-top:1.5rem;">
                    <p style="color:var(--ink-soft);">Loading chapters…</p>
                </div>

                <p style="margin-top:2rem; color:var(--ink-soft);">Full site admin? <a href="members-admin.html" style="font-weight:800; color:var(--green-dark);">Go to the full admin &rarr;</a></p>
            </div>
        </section>
    </main>

    <!-- Live chapter list (from Firestore via firebase-data.js, falling back to data.js). Updates
         automatically as chapters are created/deleted. Clicking a chapter opens its
         chapter-<id>-admin.html page; login + the security rules decide what the user may edit.
         NOTE: a new chapter needs its chapter-<id>-admin.html file created (see chapter-admin.html). -->
    <script src="data.js"></script>
    <script src="firebase-data.js"></script>
    <script>
        (function () {
            function esc(s) { var d = document.createElement("div"); d.textContent = (s == null ? "" : String(s)); return d.innerHTML; }
            function render() {
                var grid = document.getElementById("admin-chapter-grid");
                if (!grid) return;
                var chapters = (window.BFBL_DATA && Array.isArray(window.BFBL_DATA.chapters)) ? window.BFBL_DATA.chapters : [];
                if (!chapters.length) { grid.innerHTML = '<p style="color:var(--ink-soft);">No chapters yet.</p>'; return; }
                grid.innerHTML = chapters.map(function (c) {
                    return '<a class="admin-chapter-card" href="chapter-' + encodeURIComponent(c.id || "") + '-admin.html">' +
                        '<strong>' + esc(c.name || c.id) + '</strong>' +
                        (c.location ? '<span class="admin-chapter-loc">' + esc(c.location) + '</span>' : '') +
                        '<span class="admin-chapter-cta">Sign in to edit &rarr;</span>' +
                    '</a>';
                }).join("");
            }
            if (window.BFBL_DATA_READY && window.BFBL_DATA_READY.then) {
                window.BFBL_DATA_READY.then(render);
            } else {
                render();
            }
        })();
    </script>
</body>
</html>
