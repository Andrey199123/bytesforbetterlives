<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Structure · Admin | Bytes for Better Lives</title>
    <link rel="icon" type="image/avif" href="images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">

    <meta name="google-site-verification" content="zX6BUNOBV4yH4PZD7fEVflyBRPSL3XbNYfznUh8AgJU" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="images/logo.avif" alt="Bytes for Better Lives logo"></a>
            <ul class="nav-menu"></ul>
        </div>
    </nav>

    <main>
        <section class="section" style="padding-block: 1.25rem 3rem;">
            <div class="admin-wrap">
                <div class="admin-head">
                    <div><h1 style="margin:0; font-size:1.6rem;">Content admin</h1></div>
                    <div class="admin-actions" id="admin-actions" style="display:none;">
                        <span id="autosave-status">All changes saved</span>
                        <span id="admin-who" style="font-weight:800;"></span>
                        <button class="btn btn-secondary" id="sign-out" type="button">Sign out</button>
                    </div>
                </div>

                <div id="admin-message" class="impact-card" style="margin:1.25rem 0; display:none;"></div>

                <div id="login-box" class="impact-card" style="display:none; gap:0.85rem; max-width:460px;">
                    <h3>Sign in</h3>
                    <p style="color:var(--ink-soft); margin:0;">Use the Bytes for Better Lives Google account.</p>
                    <div class="btn-row">
                        <button class="gsi-button" id="google-signin" type="button">
                            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                            </svg>
                            <span>Sign in with Google</span>
                        </button>
                    </div>
                    <p id="login-error" style="color:#b00020; font-weight:700; display:none; margin:0;"></p>
                </div>

                <div id="admin-panel" style="display:none;">
                    <div class="admin-tabs">
                        <a class="admin-tab" href="members-admin.html">Members</a>
                        <a class="admin-tab" href="gallery-admin.html">Gallery</a>
                        <a class="admin-tab" href="chapters-admin.html">Chapters</a>
                        <a class="admin-tab" href="chapter-pages-admin.html">Chapter Pages</a>
                        <a class="admin-tab" href="initiatives-admin.html">Initiatives</a>
                        <a class="admin-tab" href="fundraisers-admin.html">Fundraisers</a>
                        <a class="admin-tab active" href="structure-admin.html">Structure</a>
                    </div>

                    <section class="admin-section active" id="section-structure">
                        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:1.5rem; max-width:1160px;">
                            <div>
                                <div class="admin-toolbar"><strong>Categories</strong></div>
                                <div id="structure-categories" style="display:grid; gap:0.4rem;"></div>
                                <div class="btn-row" style="margin-top:0.75rem;">
                                    <input id="new-category" placeholder="New category" style="flex:1; padding:0.45rem 0.5rem; border:1px solid var(--line); border-radius:8px; font:inherit;">
                                    <button class="btn btn-secondary" id="add-category" type="button">+ Add</button>
                                </div>
                            </div>
                            <div>
                                <div class="admin-toolbar"><strong>Titles</strong></div>
                                <div id="structure-titles" style="display:grid; gap:0.4rem;"></div>
                                <div class="btn-row" style="margin-top:0.75rem;">
                                    <input id="new-title" placeholder="New title" style="flex:1; padding:0.45rem 0.5rem; border:1px solid var(--line); border-radius:8px; font:inherit;">
                                    <button class="btn btn-secondary" id="add-title" type="button">+ Add</button>
                                </div>
                            </div>
                        </div>

                        <div style="max-width:760px; margin-top:2rem;">
                            <div class="admin-toolbar"><strong>Chapter admins</strong>
                                <span style="color:var(--ink-soft);">An approved email may edit only its chapter (page + members).</span>
                            </div>
                            <div id="structure-chapter-admins" style="display:grid; gap:0.4rem;"></div>
                            <div class="btn-row" style="margin-top:0.75rem;">
                                <input id="new-chapter-admin-email" type="email" placeholder="admin@email.com" style="flex:1; padding:0.45rem 0.5rem; border:1px solid var(--line); border-radius:8px; font:inherit;">
                                <select id="new-chapter-admin-chapter" style="padding:0.45rem 0.5rem; border:1px solid var(--line); border-radius:8px; font:inherit;"></select>
                                <button class="btn btn-secondary" id="add-chapter-admin" type="button">+ Add</button>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <script src="data.js"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
