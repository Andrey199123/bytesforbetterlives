<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FCFAF5">
    <meta name="description" content="Explore the Los Angeles Chapter of Bytes for Better Lives: leadership, fundraisers, and chapter highlights.">
    <title>Los Angeles Chapter | Bytes for Better Lives</title>
    <link rel="icon" type="image/avif" href="images/logo.avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Gabarito:wght@400..900&display=swap">
    <link rel="stylesheet" href="styles.css">
    <!-- The three end-of-<body> scripts build the navbar, the footer and the page's content, so the
         browser must have them BEFORE it first paints or the bar paints logo-only and the grids
         paint empty. Without these hints the preload scanner only reaches them at the end of the
         body, at low priority. MUST-COPY-VERBATIM into every new public shell, like the three font
         <link>s, the theme-color meta and the nav-overlay body class. -->
    <link rel="preload" as="script" href="data.js">
    <link rel="preload" as="script" href="firebase-data.js">
    <link rel="preload" as="script" href="script.js">
    <link rel="canonical" href="https://los-angeles.bytesforbetterlives.net/">


    <!-- Social share preview (Open Graph + Twitter) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Bytes for Better Lives">
    <meta property="og:title" content="Los Angeles Chapter | Bytes for Better Lives">
    <meta property="og:description" content="Explore the Los Angeles Chapter of Bytes for Better Lives: leadership, fundraisers, and chapter highlights.">
    <meta property="og:url" content="https://los-angeles.bytesforbetterlives.net/">
    <meta property="og:image" content="https://www.bytesforbetterlives.net/images/hero-banner.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="google-site-verification" content="zX6BUNOBV4yH4PZD7fEVflyBRPSL3XbNYfznUh8AgJU" />
</head>
<body class="nav-overlay" data-chapter-id="los-angeles">
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="images/logo.avif" alt="Bytes for Better Lives logo" width="460" height="462">
            </a>
            <button class="hamburger" type="button" aria-label="Open navigation menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-menu"></ul>
        </div>
    </nav>



    <footer class="footer">
        <div class="container"></div>
    </footer>

    <!-- First-paint state for the overlay navbar. MUST-COPY-VERBATIM into any new public page that
         opens with a hero. ADD-ONLY: solid stays the CSS default, so JS off, a throw, or a CSP that
         drops this all still leave the readable bar. It runs before the three scripts below, so the
         bar is transparent over the hero from the first paint even if they are slow. The `load`
         handler closes the one failure this introduces — class added and never removed because
         script.js never reached initNavOverlay(). Its geometry test is PAIRED with the one in
         initNavOverlay() (script.js): change one, change both. On a chapter stub there is no hero
         yet (script.js injects it), so it bails by design and the bar stays solid. -->
    <script>(function(){try{
      var b=document.body,n=document.querySelector(".navbar");
      if(!n||!b||!b.classList.contains("nav-overlay"))return;
      var h=document.querySelector(".home-hero,.hero-editorial,.chapter-hero");
      if(!h)return;
      var navH=n.offsetHeight||76;
      if(h.getBoundingClientRect().bottom>navH)n.classList.add("is-over-hero");
      addEventListener("load",function(){
        if(!window.__bfblNavOverlayReady)n.classList.remove("is-over-hero");
      });
    }catch(e){}})();</script>
    <script src="data.js"></script>
    <script src="firebase-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
